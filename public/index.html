<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
		/>

		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />

		<title>Fly Trip Chat App</title>

		<style>
			:root {
				--primary-color: #f6821f;
				--primary-hover: #ff8f2b;

				--bg-color: #000000;
				--surface-color: #080808;
				--surface-2-color: #101010;
				--surface-3-color: #161616;

				--border-color: #242424;
				--border-light: #303030;

				--text-color: #f5f5f5;
				--text-light: #929292;
				--text-muted: #666666;

				--user-msg-bg: #1c130b;
				--assistant-msg-bg: #111111;

				--input-bg: #0b0b0b;

				--radius: 10px;
				--safe-bottom: env(safe-area-inset-bottom, 0px);
				--safe-top: env(safe-area-inset-top, 0px);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html {
				width: 100%;
				min-height: 100%;
				background: var(--bg-color);
				color-scheme: dark;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
					Ubuntu, Cantarell, "Helvetica Neue", sans-serif;

				line-height: 1.6;

				width: 100%;
				min-height: 100dvh;

				margin: 0;
				padding:
					max(0.75rem, var(--safe-top))
					0.75rem
					calc(0.75rem + var(--safe-bottom));

				background: var(--bg-color);
				color: var(--text-color);

				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;

				overflow-x: hidden;
			}

			/* =========================
			   MAIN APP CONTAINER
			========================= */

			.app {
				width: 100%;
				max-width: 800px;
				margin: 0 auto;
			}

			/* =========================
			   HEADER
			========================= */

			header {
				text-align: center;
				margin-bottom: 1rem;
				padding: 0.85rem 0;

				border-bottom: 1px solid var(--border-color);

				background: var(--bg-color);
			}

			h1 {
				font-size: clamp(1.2rem, 5vw, 1.5rem);
				line-height: 1.3;
				color: var(--primary-color);

				word-break: break-word;
			}

			header p {
				margin-top: 0.25rem;
				font-size: 0.85rem;
				color: var(--text-light);
			}

			/* =========================
			   CHAT CONTAINER
			========================= */

			.chat-container {
				display: flex;
				flex-direction: column;

				width: 100%;

				height: calc(100dvh - 150px);
				min-height: 400px;

				border: 1px solid var(--border-color);
				border-radius: var(--radius);

				overflow: hidden;

				background: var(--surface-color);

				box-shadow:
					0 10px 40px rgba(0, 0, 0, 0.45),
					0 0 0 1px rgba(255, 255, 255, 0.01);
			}

			/* =========================
			   CHAT MESSAGES
			========================= */

			.chat-messages {
				flex: 1;

				min-height: 0;

				overflow-y: auto;
				overflow-x: hidden;

				padding: 1rem;

				background: var(--bg-color);

				scroll-behavior: smooth;

				-webkit-overflow-scrolling: touch;

				overscroll-behavior: contain;
			}

			/* Scrollbar */

			.chat-messages::-webkit-scrollbar {
				width: 5px;
			}

			.chat-messages::-webkit-scrollbar-track {
				background: #000000;
			}

			.chat-messages::-webkit-scrollbar-thumb {
				background: #303030;
				border-radius: 10px;
			}

			.chat-messages::-webkit-scrollbar-thumb:hover {
				background: #444444;
			}

			/* =========================
			   MESSAGE
			========================= */

			.message {
				margin-bottom: 0.85rem;

				padding: 0.75rem 0.9rem;

				border-radius: 10px;

				max-width: min(80%, 650px);

				border: 1px solid var(--border-color);

				word-wrap: break-word;
				overflow-wrap: anywhere;

				animation: messageIn 0.18s ease-out;
			}

			@keyframes messageIn {
				from {
					opacity: 0;
					transform: translateY(4px);
				}

				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.message p {
				white-space: pre-line;

				margin: 0;

				overflow-wrap: anywhere;

				font-size: 0.95rem;
				line-height: 1.55;
			}

			/* User */

			.user-message {
				background: var(--user-msg-bg);

				align-self: flex-end;

				margin-left: auto;

				border-color: rgba(246, 130, 31, 0.25);
			}

			/* Assistant */

			.assistant-message {
				background: var(--assistant-msg-bg);

				align-self: flex-start;

				margin-right: auto;
			}

			/* =========================
			   TYPING INDICATOR
			========================= */

			.typing-indicator {
				display: none;

				flex-shrink: 0;

				font-style: italic;

				color: var(--text-light);

				padding: 0.55rem 1rem;

				background: var(--surface-color);

				border-top: 1px solid var(--border-color);

				font-size: 0.85rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			/* =========================
			   INPUT AREA
			========================= */

			.message-input {
				display: flex;

				flex-shrink: 0;

				width: 100%;

				padding: 0.65rem;

				gap: 0.5rem;

				border-top: 1px solid var(--border-color);

				background: var(--surface-color);

				padding-bottom:
					max(0.65rem, var(--safe-bottom));
			}

			/* =========================
			   TEXTAREA
			========================= */

			#user-input {
				flex: 1;

				width: 100%;
				min-width: 0;

				min-height: 44px;
				max-height: 140px;

				padding: 0.7rem 0.8rem;

				border: 1px solid var(--border-color);

				border-radius: 8px;

				background: var(--input-bg);
				color: var(--text-color);

				font-family: inherit;
				font-size: 16px;

				line-height: 1.45;

				resize: none;

				outline: none;

				-webkit-appearance: none;

				transition:
					border-color 0.2s ease,
					background-color 0.2s ease;
			}

			#user-input::placeholder {
				color: var(--text-muted);
			}

			#user-input:focus {
				border-color: rgba(246, 130, 31, 0.7);

				background: #0e0e0e;

				box-shadow:
					0 0 0 2px rgba(246, 130, 31, 0.08);
			}

			/* =========================
			   SEND BUTTON
			========================= */

			#send-button {
				flex-shrink: 0;

				min-width: 64px;
				min-height: 44px;

				padding: 0 1rem;

				background: var(--primary-color);
				color: #ffffff;

				border: none;
				border-radius: 8px;

				cursor: pointer;

				font-family: inherit;
				font-size: 0.9rem;
				font-weight: 600;

				transition:
					background-color 0.2s ease,
					transform 0.1s ease,
					opacity 0.2s ease;

				-webkit-tap-highlight-color: transparent;
			}

			#send-button:hover {
				background: var(--primary-hover);
			}

			#send-button:active {
				transform: scale(0.97);
			}

			#send-button:disabled {
				background: #3b3b3b;
				color: #777777;

				cursor: not-allowed;

				transform: none;
			}

			/* =========================
			   FOOTER
			========================= */

			footer {
				margin-top: 0.75rem;

				padding: 0.5rem 0;

				text-align: center;

				font-size: 0.75rem;

				color: var(--text-light);
			}

			footer p {
				margin: 0;
			}

			/* =========================
			   TABLET / DESKTOP
			========================= */

			@media (min-width: 650px) {
				body {
					padding: 1.25rem;
				}

				header {
					margin-bottom: 1.25rem;
					padding: 1rem 0;
				}

				.chat-container {
					height: calc(100dvh - 175px);
				}

				.chat-messages {
					padding: 1.25rem;
				}

				.message {
					padding: 0.8rem 1rem;
				}

				.message p {
					font-size: 0.95rem;
				}
			}

			/* =========================
			   SMALL MOBILE
			========================= */

			@media (max-width: 480px) {
				body {
					padding:
						max(0.5rem, var(--safe-top))
						0.5rem
						calc(0.5rem + var(--safe-bottom));
				}

				header {
					margin-bottom: 0.7rem;
					padding: 0.65rem 0;
				}

				header p {
					font-size: 0.78rem;
				}

				.chat-container {
					height: calc(100dvh - 120px);
					min-height: 350px;

					border-radius: 9px;
				}

				.chat-messages {
					padding: 0.75rem;
				}

				.message {
					max-width: 88%;

					padding: 0.65rem 0.75rem;

					margin-bottom: 0.65rem;
				}

				.message p {
					font-size: 0.9rem;
				}

				.message-input {
					padding: 0.5rem;

					gap: 0.4rem;
				}

				#user-input {
					min-height: 44px;

					padding: 0.65rem 0.7rem;

					font-size: 16px;
				}

				#send-button {
					min-width: 58px;

					padding: 0 0.75rem;

					font-size: 0.85rem;
				}

				footer {
					margin-top: 0.5rem;
					font-size: 0.7rem;
				}
			}

			/* =========================
			   VERY SMALL PHONES
			========================= */

			@media (max-width: 360px) {
				.message {
					max-width: 92%;
				}

				#send-button {
					min-width: 54px;
					padding: 0 0.6rem;
				}
			}

			/* =========================
			   REDUCED MOTION
			========================= */

			@media (prefers-reduced-motion: reduce) {
				* {
					scroll-behavior: auto !important;
					animation-duration: 0.01ms !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>

	<body>
		<div class="app">
			<header>
				<h1>Fly Trip Chat</h1>
				<p>Powered by Cloudflare Workers AI</p>
			</header>

			<main class="chat-container">
				<div id="chat-messages" class="chat-messages">
					<div class="message assistant-message">
						<p>
							Hello! I'm an AI assistant powered by Cloudflare Workers AI.
							How can I help you today?
						</p>
					</div>
				</div>

				<div
					class="typing-indicator"
					id="typing-indicator"
					aria-live="polite"
					aria-hidden="true"
				>
					AI is thinking...
				</div>

				<div class="message-input">
					<textarea
						id="user-input"
						placeholder="Type your message here..."
						rows="1"
						autocomplete="off"
						autocapitalize="sentences"
						spellcheck="true"
						aria-label="Message"
					></textarea>

					<button
						id="send-button"
						type="button"
						aria-label="Send message"
					>
						Send
					</button>
				</div>
			</main>

			<footer>
				<p>Fly Trip AI &copy; 2025</p>
			</footer>
		</div>

		<!--
			chat.js
			Expected API endpoint:
			/api/chat

			Keep this file beside index.html / in your Worker Assets.
		-->
		<script src="/chat.js" defer></script>
	</body>
</html>
