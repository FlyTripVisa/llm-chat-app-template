<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --accent: #f6821f;
      --accent-2: #fbbf24;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body { display: flex; justify-content: center; align-items: center; padding: 1rem; }

    .chat-app {
      width: 100%;
      max-width: 860px;
      height: min(90vh, 800px);
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: linear-gradient(90deg, rgba(246,130,31,0.15), transparent);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #64748b;
      transition: background 0.3s;
    }
    .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .dot.connecting { background: var(--accent-2); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }

    .presence {
      padding: 0.5rem 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .presence .user {
      background: var(--panel-2);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 4px; }

    .msg {
      max-width: 75%;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      background: var(--panel-2);
      word-wrap: break-word;
      overflow-wrap: anywhere;
      animation: fade 0.2s ease-out;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

    .msg .meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
    }
    .msg .meta .name { color: var(--accent-2); font-weight: 600; font-size: 0.8rem; }
    .msg.self { align-self: flex-end; background: linear-gradient(135deg, #f6821f, #ea580c); color: #fff; }
    .msg.self .meta, .msg.self .meta .name { color: rgba(255,255,255,0.85); }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-style: italic;
      text-align: center;
      max-width: 90%;
    }

    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input:disabled { opacity: 0.5; cursor: not-allowed; }
    button {
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-app">
    <header>
      <h1>💬 Cloudflare Chat</h1>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </header>
    <div class="presence" id="presence"></div>
    <div id="messages"></div>
    <form id="chatForm" autocomplete="off">
      <input
        type="text"
        id="input"
        placeholder="Connecting…"
        maxlength="2000"
        disabled
      />
      <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
  </div>
  <script src="/chat.js"></script>
</body>
</html>
