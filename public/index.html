<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LlamaIndex Chat UI · Simple Demo</title>
  <!-- Font Awesome for send icon (clean, no external JS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #ffffff;
      color: #111827;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ----- LAYOUT (flex container mimicking original structure) ----- */
    .app {
      display: flex;
      gap: 2.5rem; /* gap-10 */
      min-height: 100vh;
    }

    /* ----- LEFT SIDEBAND (hidden on mobile, 1/3 width on md+) ----- */
    .sidebar {
      display: none; /* hidden by default (mobile) */
      width: 33.333%; /* w-1/3 */
      justify-content: center;
      align-items: center;
      padding: 2.5rem; /* p-10 */
      background: white;
    }

    @media (min-width: 768px) {
      .sidebar {
        display: flex;
      }
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 2.5rem; /* space-y-10 */
      max-width: 28rem;
      width: 100%;
    }

    /* Gradient title */
    .gradient-title {
      font-size: 3.75rem; /* text-6xl */
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(to right, #e711dd, #b5f2fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .demo-title {
      font-size: 1.5rem; /* text-2xl */
      font-weight: 700;
      margin-bottom: 1rem; /* mb-4 */
      color: #111827;
    }

    /* Code block wrapper */
    .code-block-wrapper {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      right: 0.5rem;
      top: 0.5rem;
      background: #3f3f46; /* zinc-700 */
      color: white;
      border: none;
      border-radius: 0.375rem; /* rounded-md */
      padding: 0.25rem 0.75rem; /* px-3 py-1 */
      font-size: 0.875rem; /* text-sm */
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      z-index: 10;
    }

    .copy-btn:hover {
      background: #52525b; /* zinc-600 */
    }

    .code-block {
      overflow: hidden;
      border-radius: 0.5rem; /* rounded-lg */
      border: 1px solid #3f3f46; /* border-zinc-700 */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); /* shadow-lg */
      background: #0a0a0a; /* dark background for code (not specified, but nice) */
    }

    .code-block code {
      display: block;
      padding: 1rem; /* p-4 */
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 0.875rem;
      color: #e4e4e7; /* zinc-200 */
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ----- RIGHT SIDE (CHAT PANEL) ----- */
    .chat-panel {
      width: 100%;
      background: #ffffff;
    }

    @media (min-width: 768px) {
      .chat-panel {
        width: 66.666%; /* w-2/3 */
        border-left: 1px solid #e5e7eb; /* md:border-l (default gray-200-ish) */
      }
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 1rem; /* gap-4 */
      width: 100%;
      max-width: 48rem; /* max-w-3xl */
      height: 100vh; /* h-screen */
      margin: 0 auto;
      overflow: hidden;
      padding: 0;
    }

    @media (min-width: 768px) {
      .chat-container {
        padding: 1.25rem; /* md:p-5 */
      }
    }

    /* Inner chat area (flex column) */
    .chat-inner {
      background: #ffffff; /* bg-background */
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1 1 0%;
      min-height: 0;
      gap: 1.5rem; /* space-y-6 */
      padding: 1rem; /* p-4 */
      padding-bottom: 0; /* pb-0 */
    }

    /* message area (flex-1, overflow) */
    .message-area {
      display: flex;
      flex-direction: column;
      flex: 1 1 0%;
      min-height: 0;
      gap: 1.25rem; /* gap-5 */
      overflow-y: auto;
    }

    /* Welcome screen (center) */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding-top: 1rem;
    }

    .welcome-line-1 {
      font-size: 1.875rem; /* text-3xl */
      font-weight: 700;
      margin-bottom: 0.5rem;
      animation: slide-up 0.5s ease-out forwards;
      animation-delay: 0.1s;
      opacity: 0;
    }

    .welcome-line-2 {
      font-size: 1.25rem; /* text-xl */
      color: #6b7280; /* text-muted-foreground */
      animation: slide-up 0.5s ease-out forwards;
      animation-delay: 0.3s;
      opacity: 0;
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Chat messages (dynamic) */
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      animation: fade-in 0.2s ease;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb; /* blue-600 */
      color: white;
      border-bottom-right-radius: 0.25rem;
    }

    .message.bot {
      align-self: flex-start;
      background: #f3f4f6; /* gray-100 */
      color: #111827;
      border-bottom-left-radius: 0.25rem;
    }

    @keyframes fade-in {
      from { opacity: 0.6; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input area (sticky bottom) */
    .input-area {
      background: #ffffff; /* bg-background */
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      gap: 1rem; /* gap-4 */
      padding: 1rem; /* p-4 */
      padding-top: 0; /* pt-0 */
    }

    .chat-form {
      position: relative;
      display: flex;
      gap: 0.5rem; /* gap-2 */
    }

    .chat-textarea {
      border: 1px solid #e5e7eb; /* border-input */
      background: #f9fafb; /* bg-secondary (light gray) */
      height: 100px;
      max-height: 400px;
      min-height: 0;
      flex: 1;
      resize: none;
      overflow-y: auto;
      border-radius: 1rem; /* rounded-2xl */
      padding: 1rem; /* p-4 */
      font-size: 0.875rem; /* text-sm */
      font-family: inherit;
      color: #111827;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .chat-textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .chat-textarea::placeholder {
      color: #9ca3af; /* placeholder:text-muted-foreground */
      font-weight: 400;
    }

    .chat-textarea:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .send-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 0.875rem;
      font-weight: 500;
      background: #2563eb; /* bg-primary */
      color: #ffffff; /* text-primary-foreground */
      border: none;
      border-radius: 9999px; /* rounded-full */
      width: 2.5rem; /* w-10 */
      height: 2.5rem; /* h-10 */
      position: absolute;
      bottom: 0.5rem; /* bottom-2 */
      right: 0.5rem; /* right-2 */
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      padding: 0;
    }

    .send-button:hover:not(:disabled) {
      background: #1d4ed8; /* hover:bg-primary/90 approx */
    }

    .send-button:disabled {
      pointer-events: none;
      opacity: 0.5; /* disabled:opacity-50 */
    }

    .send-button i {
      font-size: 1rem;
      line-height: 1;
    }

    /* Utility for hiding */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Make sure the full height fills viewport */
    html, body, #root {
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR (demo info) -->
    <div class="sidebar">
      <div class="sidebar-content">
        <h1 class="gradient-title">LlamaIndex ChatUI</h1>
        <h2 class="demo-title">Simple Chat Demo</h2>
        <div class="code-block-wrapper">
          <button class="copy-btn" type="button" id="copyBtn">Copy</button>
          <pre class="code-block"><code>import { ChatSection } from '@llamaindex/chat-ui'
import { useChat } from "@ai-sdk/react";

function SimpleChat() {
  const handler = useChat()
  return &lt;ChatSection handler={handler} /&gt;
}</code></pre>
        </div>
      </div>
    </div>

    <!-- RIGHT CHAT PANEL -->
    <div class="chat-panel">
      <div class="chat-container">
        <div class="chat-inner">
          <!-- Message area (welcome + chat) -->
          <div class="message-area" id="messageArea">
            <!-- Welcome screen (initially visible) -->
            <div class="welcome-screen" id="welcomeScreen">
              <p class="welcome-line-1">Hello there!</p>
              <p class="welcome-line-2">I'm here to help you with your questions.</p>
            </div>
            <!-- Dynamic messages will be inserted here -->
            <div class="messages-list" id="messagesList"></div>
          </div>

          <!-- Input area -->
          <div class="input-area">
            <form class="chat-form" id="chatForm">
              <textarea
                class="chat-textarea"
                name="input"
                id="messageInput"
                placeholder="Type a message..."
                spellcheck="false"
                rows="1"
              ></textarea>
              <button class="send-button" type="submit" id="sendButton" disabled>
                <i class="fas fa-paper-plane"></i>
                <span class="sr-only">Send</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----- DOM refs -----
      const messageArea = document.getElementById('messageArea');
      const welcomeScreen = document.getElementById('welcomeScreen');
      const messagesList = document.getElementById('messagesList');
      const chatForm = document.getElementById('chatForm');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const copyBtn = document.getElementById('copyBtn');

      // ----- Simple chat state -----
      let messages = []; // { role: 'user' | 'bot', content: string }
      let isSending = false; // prevent double sends

      // ----- Helper: update UI based on messages & welcome visibility -----
      function renderMessages() {
        // If there are messages, hide welcome screen; else show it.
        if (messages.length > 0) {
          welcomeScreen.style.display = 'none';
        } else {
          welcomeScreen.style.display = 'flex';
        }

        // Clear message list and re-render
        messagesList.innerHTML = '';
        messages.forEach((msg, index) => {
          const messageDiv = document.createElement('div');
          messageDiv.className = `message ${msg.role}`;
          messageDiv.textContent = msg.content;
          messagesList.appendChild(messageDiv);
        });

        // Scroll to bottom (if messages exist)
        if (messages.length > 0) {
          messageArea.scrollTop = messageArea.scrollHeight;
        }
      }

      // ----- Add a message and re-render -----
      function addMessage(role, content) {
        messages.push({ role, content });
        renderMessages();
      }

      // ----- Enable/disable send button based on input -----
      function updateSendButton() {
        const hasText = messageInput.value.trim().length > 0;
        sendButton.disabled = !hasText || isSending;
      }

      // ----- Simulate bot response (with slight delay) -----
      function getBotReply(userMessage) {
        const lower = userMessage.toLowerCase();
        if (lower.includes('hello') || lower.includes('hi')) {
          return 'Hello! How can I assist you today?';
        } else if (lower.includes('how are you')) {
          return 'I am just a demo, but I am functioning perfectly! Thanks for asking.';
        } else if (lower.includes('bye')) {
          return 'Goodbye! Feel free to come back anytime.';
        } else if (lower.includes('?')) {
          return 'That is an interesting question. In a real app, I would use an LLM to answer.';
        } else {
          return `You said: "${userMessage}". (This is a simulated response.)`;
        }
      }

      // ----- Handle form submit -----
      function handleSubmit(e) {
        e.preventDefault();

        const text = messageInput.value.trim();
        if (!text || isSending) return;

        // 1. Add user message
        addMessage('user', text);
        messageInput.value = ''; // clear input
        updateSendButton(); // disable send while bot replies
        isSending = true;

        // 2. Simulate bot typing / response after short delay
        setTimeout(() => {
          const reply = getBotReply(text);
          addMessage('bot', reply);
          isSending = false;
          updateSendButton();
          // Focus back on textarea for convenience
          messageInput.focus();
        }, 400);
      }

      // ----- Copy code snippet (simple) -----
      function handleCopy() {
        const codeElement = document.querySelector('.code-block code');
        if (!codeElement) return;
        const textToCopy = codeElement.innerText;

        navigator.clipboard.writeText(textToCopy).then(() => {
          // Temporary feedback
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 1500);
        }).catch(() => {
          // Fallback
          alert('Press Ctrl+C to copy (or Cmd+C on Mac)');
        });
      }

      // ----- Initialize event listeners -----
      function init() {
        // Input events
        messageInput.addEventListener('input', updateSendButton);
        // Initial button state
        updateSendButton();

        // Form submit
        chatForm.addEventListener('submit', handleSubmit);

        // Allow Enter to submit (Shift+Enter for new line)
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!sendButton.disabled) {
              chatForm.dispatchEvent(new Event('submit'));
            }
          }
        });

        // Copy button
        copyBtn.addEventListener('click', handleCopy);

        // Ensure welcome screen is visible on load (messages empty)
        renderMessages();

        // Focus textarea on load (optional, but nice)
        messageInput.focus();
      }

      // Run init when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
